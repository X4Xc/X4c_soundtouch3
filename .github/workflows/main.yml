name: Build X4C_SoundTouch APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recreate project
        run: |
          python3 << 'PY'
          import base64, pathlib
          files = {
            'build.gradle': 'CnBsdWdpbnMgeyBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4wJyBhcHBseSBmYWxzZQogICAgICAgICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4wJyBhcHBseSBmYWxzZSB9Cg==',
            'settings.gradle': 'aW5jbHVkZSAnOmFwcCcK',
            'app/build.gradle': '',
            'app/src/main/AndroidManifest.xml': '',
            'app/src/main/res/values/colors.xml': '',
            'app/src/main/res/values/strings.xml': 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlg0Q19Tb3VuZFRvdWNoPC9zdHJpbmc+CjwvcmVzb3VyY2VzPg==',
            'app/src/main/res/values/themes.xml': '',
            'app/src/main/java/com/x4c/soundtouch/MainActivity.kt': '',
          }
          for path, b64 in files.items():
              data = base64.b64decode(b64)
              pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(path).write_bytes(data)
              print(f"Wrote {path}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          ls latest/bin/
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X4C_SoundTouch-APK
          path: app/build/outputs/apk/debug/*.apk
