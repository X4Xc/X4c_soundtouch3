          cat > app/src/main/java/com/x4c/soundtouch/MainActivity.kt <<'KT'

package com.x4c.soundtouch

import android.os.Bundle
import android.widget.Toast
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.lazy.LazyColumn
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Modifier
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp
import kotlinx.coroutines.*
import java.net.HttpURLConnection
import java.net.URL

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent { X4CApp() }
    }
}

data class Radio(val name: String, val url: String)

val belgianRadios = listOf(
    Radio("Qmusic BE", "https://icecast-qmusicbe-cdp.edge.3ac.be/qmusic.mp3"),
    Radio("Joe FM", "https://icecast-joe-cdp.edge.3ac.be/joe.mp3"),
    Radio("Willy", "https://icecast-willy-cdp.edge.3ac.be/willy.mp3"),
    Radio("Radio 2 Antw", "https://icecast-vrt-cdp.edge.3ac.be/radio2_antwerpen_96.mp3"),
    Radio("MNM", "https://icecast-vrt-cdp.edge.3ac.be/mnm_96.mp3"),
    Radio("Studio Brussel", "https://icecast-vrt-cdp.edge.3ac.be/stubru_96.mp3"),
    Radio("Qmusic Classic", "https://icecast-qmusicbe-cdp.edge.3ac.be/q-classic.mp3"),
    Radio("Top Radio", "https://stream.topradio.be/topradio.mp3")
)

@OptIn(ExperimentalMaterial3Api::class)
@Composable
fun X4CApp() {
    var ip by remember { mutableStateOf("192.168.129.8") }
    var volume by remember { mutableStateOf(28f) }
    var nowPlaying by remember { mutableStateOf("Geen weergave") }
    var status by remember { mutableStateOf("OFFLINE") }
    var log by remember { mutableStateOf("Klaar voor verbinding") }
    val scope = rememberCoroutineScope()

    fun toast(msg: String) { }

    fun request(path: String, method: String = "GET", body: String? = null): String {
        return try {
            val url = URL("http://${ip}:8090$path")
            val conn = url.openConnection() as HttpURLConnection
            conn.requestMethod = method
            conn.connectTimeout = 4000
            conn.readTimeout = 4000
            if (body != null) {
                conn.doOutput = true
                conn.setRequestProperty("Content-Type", "text/xml")
                conn.outputStream.write(body.toByteArray())
            }
            val code = conn.responseCode
            val resp = try { conn.inputStream.bufferedReader().readText() } catch (e: Exception) { conn.errorStream?.bufferedReader()?.readText() ?: "" }
            "[$code] $resp".take(500)
        } catch (e: Exception) { "FOUT: ${e.message}" }
    }

    fun testConnection() {
        scope.launch(Dispatchers.IO) {
            val r = request("/info")
            withContext(Dispatchers.Main) {
                log = r
                status = if (r.contains("SOUNDTOUCH") || r.contains("info") || r.contains("200")) "ONLINE" else "OFFLINE"
                nowPlaying = if (status=="ONLINE") "SoundTouch 30 - Verbonden" else "Geen weergave"
            }
        }
    }

    fun setVolume(v: Int) {
        scope.launch(Dispatchers.IO) {
            val xml = "<volume>$v</volume>"
            request("/volume", "POST", xml)
        }
    }

    fun pressKey(key: String) {
        scope.launch(Dispatchers.IO) {
            val xml = "<key state=\"press\" sender=\"Gabbo\">$key</key>"
            val r = request("/key", "POST", xml)
            withContext(Dispatchers.Main) { log = r }
        }
    }

    fun setPreset(presetId: Int, radio: Radio) {
        scope.launch(Dispatchers.IO) {
            val xml = """<preset id="$presetId" createdOn="0" updatedOn="0">
  <ContentItem source="INTERNET_RADIO" type="stationurl" location="${radio.url}" sourceAccount="" isPresetable="true">
    <itemName>${radio.name}</itemName>
  </ContentItem>
</preset>"""
            val r = request("/presets", "POST", xml)
            withContext(Dispatchers.Main) {
                log = "Preset $presetId -> ${radio.name}\n$r"
            }
        }
    }

    MaterialTheme(colorScheme = darkColorScheme(
        background = Color(0xFF121212),
        surface = Color(0xFF1E1E1E),
        primary = Color(0xFFFF6A1A),
        onBackground = Color.White,
        onSurface = Color.White
    )) {
        Scaffold(
            topBar = {
                TopAppBar(
                    title = { Text("X4C_SoundTouch", fontWeight = FontWeight.Bold, color = Color.White) },
                    colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0A0A0A)),
                    actions = {
                        Text(status, color = if(status=="ONLINE") Color(0xFF4CAF50) else Color.Gray, modifier = Modifier.padding(end=12.dp), fontSize = 12.sp)
                    }
                )
            },
            containerColor = Color(0xFF121212)
        ) { pad ->
            LazyColumn(modifier = Modifier.padding(pad).padding(16.dp).fillMaxSize(), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                item {
                    Card(shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                        Column(Modifier.padding(16.dp)) {
                            Text("SPEAKER IP", color = Color.Gray, fontSize = 12.sp)
                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                OutlinedTextField(value = ip, onValueChange = { ip = it }, modifier = Modifier.weight(1f), singleLine = true)
                                Button(onClick = { testConnection() }) { Text("TEST") }
                            }
                            Spacer(Modifier.height(8.dp))
                            Text(nowPlaying, color = Color.White, fontWeight = FontWeight.Bold)
                            Text(log.take(300), color = Color.Gray, fontSize = 11.sp, modifier = Modifier.padding(top=8.dp))
                        }
                    }
                }
                item {
                    Card(shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                        Column(Modifier.padding(16.dp)) {
                            Text("VOLUME & CONTROLS", color = Color.Gray, fontSize = 12.sp)
                            Slider(value = volume, onValueChange = { volume = it }, onValueChangeFinished = { setVolume(volume.toInt()) }, valueRange = 0f..100f)
                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                Button(onClick = { pressKey("PREV_TRACK") }) { Text("⏮") }
                                Button(onClick = { pressKey("PLAY_PAUSE") }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF6A1A))) { Text("▶ / ⏸") }
                                Button(onClick = { pressKey("NEXT_TRACK") }) { Text("⏭") }
                                Button(onClick = { pressKey("MUTE") }) { Text("🔇") }
                            }
                            Row(Modifier.fillMaxWidth().padding(top=8.dp), horizontalArrangement = Arrangement.SpaceEvenly) {
                                Button(onClick = { pressKey("POWER") }) { Text("POWER") }
                                Button(onClick = { pressKey("AUX") }) { Text("AUX") }
                                Button(onClick = { pressKey("BLUETOOTH") }) { Text("BT") }
                            }
                        }
                    }
                }
                item {
                    Text("PRESETS - TIK OM AF TE SPELEN, LANG DRUK OM IN TE STELLEN", color = Color.Gray, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                }
                items(6) { idx ->
                    val presetNum = idx+1
                    var selectedRadio by remember { mutableStateOf(belgianRadios[idx % belgianRadios.size]) }
                    var expanded by remember { mutableStateOf(false) }
                    Card(shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                        Column(Modifier.padding(12.dp)) {
                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                Button(onClick = { pressKey("PRESET_${presetNum}") }, modifier = Modifier.weight(1f)) { Text("P$presetNum - PLAY ${selectedRadio.name}", fontSize = 12.sp) }
                                Spacer(Modifier.width(8.dp))
                                Button(onClick = { expanded = true }) { Text("▼") }
                            }
                            if (expanded) {
                                Column {
                                    belgianRadios.forEach { radio ->
                                        TextButton(onClick = {
                                            selectedRadio = radio
                                            setPreset(presetNum, radio)
                                            expanded = false
                                        }) { Text("${radio.name}", color = Color(0xFFFF6A1A)) }
                                    }
                                }
                            }
                        }
                    }
                }
                item {
                    Text("Custom stream URL", color = Color.Gray, fontSize = 12.sp)
                    var customName by remember { mutableStateOf("Mijn Radio") }
                    var customUrl by remember { mutableStateOf("https://") }
                    var customPreset by remember { mutableStateOf("1") }
                    Column {
                        OutlinedTextField(value = customName, onValueChange = { customName = it }, label = { Text("Naam") }, modifier = Modifier.fillMaxWidth())
                        OutlinedTextField(value = customUrl, onValueChange = { customUrl = it }, label = { Text("Directe MP3/AAC URL") }, modifier = Modifier.fillMaxWidth())
                        OutlinedTextField(value = customPreset, onValueChange = { customPreset = it }, label = { Text("Preset 1-6") }, modifier = Modifier.fillMaxWidth())
                        Button(onClick = {
                            val p = customPreset.toIntOrNull() ?: 1
                            setPreset(p, Radio(customName, customUrl))
                        }, modifier = Modifier.fillMaxWidth().padding(top=8.dp)) { Text("Opslaan op preset") }
                    }
                }
            }
        }
    }
}

KT
          ls -R app
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X4C_SoundTouch-APK
          path: app/build/outputs/apk/debug/*.apk
